# ============================================================
# Murmur 唯一内容配置
# 改完这个文件，下一次构建（issue 事件或手动 dispatch）生效
# ============================================================

site:
  title: "Murmur"
  # feed 里拼绝对链接用；末尾不要带斜杠
  base_url: "https://catwb.github.io/MurMur"
  # 页脚展示的仓库地址；留空则不显示。显示名自动取 URL 里的 owner/repo
  repo: "https://github.com/Catwb/MurMur"

memos:
  # 至少命中一个才收录；空数组 = 不限
  include_labels: []
  # 命中任意一个即排除
  exclude_labels: []
  # 命中则置顶（置顶 label 不会出现在展示标签里）
  pinned_labels: ["置顶", "pinned"]
  # 与 workflow 粗筛配合：workflow 只拦 NONE，精确白名单在这里
  allowed_associations: ["OWNER", "MEMBER", "COLLABORATOR"]
  # 排序后截断；0 = 不限。pinned 条目优先保留，不会被截掉
  max_count: 0
  # false = 关闭的 issue 从站点消失
  include_closed: false
  # created_desc | created_asc | updated_desc
  sort: created_desc
  # 标题为空时取正文首个非空行（strip markdown 后）截 80 字
  title_fallback: true
  # 下发给前端，保证「数据 + 渲染规则」同源
  render:
    gfm: true
    breaks: true

build:
  output_dir: dist
  json_path: memos.json
  detail_dir: memo
  group_by_date: true

feed:
  enabled: true
  formats: ["rss", "json"]
  # true = 正文转 HTML 全文；false = 纯文本摘要 + 链接
  full_content: false

lightbox:
  enabled: true

# ============================================================
# 作者展示信息（可选）
# 把 GitHub 用户名映射成昵称 / 自定义头像。key 是 GitHub login，大小写不敏感。
# 没配置的字段回退到 GitHub 原值；没配置的作者完全不受影响。
#
# avatar 支持两种写法：
#   1. 完整 URL：https://example.com/me.png
#   2. 仓库内本地文件：assets/avatars/catwb.png
#      构建时会复制到产物 dist/avatars/ 下，站点自包含、不依赖图床
# ============================================================
authors:
  catwb:
    name: "绮曜"
    avatar: "assets/avatars/catwb.svg"
  # 想加更多作者，照这个格式往下写：
  # someone:
  #   name: "某人"
  #   avatar: "https://example.com/someone.png"

# ============================================================
# 自定义样式与字体（可选）
# 路径都相对仓库根；文件会被复制进产物，站点保持自包含。
# ============================================================
custom:
  # 远程样式表：直接以 <link> 引入，不复制进产物
  # 适合中文网字计划 / Google Fonts 这类「CSS + unicode-range 分片」的字体方案，
  # 浏览器只会下载当前页面用到的字形分片，比整包字体小得多。
  # 也可以用来引入任何远程样式覆盖。
  remote_css:
    - "https://cdn.xrbk.cn/fonts/LXGWWenKaiGB-Regular/result.css"

  # 自定义 CSS：按顺序在 style.css 之后引入，后引入的优先级更高
  # 注意：CSS 里的相对 url() 会相对产物 custom/ 目录解析，图片请用绝对 URL 或放进 custom/
  css: []
  #   - "assets/custom.css"

  # 自定义字体：构建时复制到产物 fonts/，自动生成 @font-face
  fonts: []
  #   - family: "LXGW WenKai"
  #     src: "assets/fonts/LXGWWenKai-Regular.woff2"
  #     weight: 400
  #     style: normal

  # 正文字体族：填了就用它覆盖 --font-body（后面自动补内置回退栈）
  # 例："LXGW WenKai" 或 "LXGW WenKai, sans-serif"
  font_family: "LXGW WenKai GB"

